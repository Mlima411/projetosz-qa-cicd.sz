name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6

      - name: Salvar Videos e Prints do Cypress
        uses: actions/upload-artifact@v4
        if: always() # Garante o salvamento das mídias mesmo se o teste falhar
        with:
          name: resultados-do-cypress
          path: cypress/videos
